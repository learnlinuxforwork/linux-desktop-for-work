<svg viewBox="0 0 1120 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Page background -->
  <rect x="0" y="0" width="1120" height="900" fill="#ffffff"/>
  <rect x="1" y="1" width="1118" height="898" fill="none" stroke="#d0d7de" stroke-width="2" rx="12"/>

  <!-- Title -->
  <text x="560" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">Linux Desktop For Work — Setup Flow</text>
  <text x="560" y="72" text-anchor="middle" font-size="14" fill="#57606a">Run from a macOS or Linux host with VirtualBox installed</text>

  <!-- Column headers -->
  <rect x="70" y="100" width="460" height="44" rx="22" fill="#E95420"/>
  <text x="300" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">canonical-ubuntu/</text>

  <rect x="590" y="100" width="460" height="44" rx="22" fill="#10B981"/>
  <text x="820" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">rocky-linux/</text>

  <!-- HOST region label -->
  <text x="30" y="230" font-size="13" font-weight="700" fill="#57606a" transform="rotate(-90 30 230)">HOST MACHINE</text>
  <rect x="55" y="168" width="1010" height="270" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="70" y="192" font-size="13" font-weight="600" fill="#57606a">01-host-create-launch-vm.sh</text>

  <!-- Ubuntu host stages -->
  <g>
    <rect x="90" y="204" width="400" height="52" rx="10" fill="#FDF1EC" stroke="#E95420" stroke-width="1.5"/>
    <text x="290" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Download Ubuntu 26.04.1 LTS ISO</text>
    <text x="290" y="244" text-anchor="middle" font-size="12" fill="#57606a">verify SHA256 checksum</text>

    <line x1="290" y1="256" x2="290" y2="278" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="90" y="280" width="400" height="52" rx="10" fill="#FDF1EC" stroke="#E95420" stroke-width="1.5"/>
    <text x="290" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Create VM (VBoxManage)</text>
    <text x="290" y="320" text-anchor="middle" font-size="12" fill="#57606a">RAM / CPU / disk sized via env vars</text>

    <line x1="290" y1="332" x2="290" y2="354" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="90" y="356" width="400" height="60" rx="10" fill="#FDF1EC" stroke="#E95420" stroke-width="2"/>
    <text x="290" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Unattended install</text>
    <text x="290" y="398" text-anchor="middle" font-size="12" fill="#57606a">VBoxManage unattended install — zero clicks</text>
  </g>

  <!-- Rocky host stages -->
  <g>
    <rect x="610" y="204" width="400" height="52" rx="10" fill="#EAFBF4" stroke="#10B981" stroke-width="1.5"/>
    <text x="810" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Download Rocky Linux 9 ISO</text>
    <text x="810" y="244" text-anchor="middle" font-size="12" fill="#57606a">"latest" build, verify SHA256 checksum</text>

    <line x1="810" y1="256" x2="810" y2="278" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="610" y="280" width="400" height="52" rx="10" fill="#EAFBF4" stroke="#10B981" stroke-width="1.5"/>
    <text x="810" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Create VM (VBoxManage)</text>
    <text x="810" y="320" text-anchor="middle" font-size="12" fill="#57606a">RAM / CPU / disk sized via env vars</text>

    <line x1="810" y1="332" x2="810" y2="354" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="610" y="356" width="400" height="60" rx="10" fill="#EAFBF4" stroke="#10B981" stroke-width="2"/>
    <text x="810" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Unattended install</text>
    <text x="810" y="392" text-anchor="middle" font-size="12" fill="#57606a">kickstart via VBoxManage, zero clicks</text>
    <text x="810" y="408" text-anchor="middle" font-size="12" fill="#57606a">+ post-install: installs GNOME Workstation group</text>
  </g>

  <!-- Password prompt note, spanning both -->
  <rect x="90" y="440" width="920" height="34" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1"/>
  <text x="560" y="462" text-anchor="middle" font-size="12.5" fill="#57606a">One password prompt up front for the new account — never put on the command line, never left on disk</text>

  <!-- Connector from host region to guest region -->
  <line x1="290" y1="416" x2="290" y2="500" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="416" x2="810" y2="500" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GUEST region -->
  <text x="30" y="640" font-size="13" font-weight="700" fill="#57606a" transform="rotate(-90 30 640)">INSIDE THE VM</text>
  <rect x="55" y="500" width="1010" height="290" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Login + copy step -->
  <rect x="90" y="514" width="400" height="46" rx="10" fill="#eef1f4" stroke="#8c959f" stroke-width="1.5"/>
  <text x="290" y="542" text-anchor="middle" font-size="13.5" fill="#1f2328">Log in, copy 02-guest-provision-ubuntu.sh in</text>

  <rect x="610" y="514" width="400" height="46" rx="10" fill="#eef1f4" stroke="#8c959f" stroke-width="1.5"/>
  <text x="810" y="542" text-anchor="middle" font-size="13.5" fill="#1f2328">Log in, copy 02-guest-provision-rocky.sh in</text>

  <line x1="290" y1="560" x2="290" y2="580" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="560" x2="810" y2="580" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Provisioning script contents (shared shape, per column) -->
  <g>
    <rect x="90" y="584" width="400" height="184" rx="10" fill="#ffffff" stroke="#E95420" stroke-width="1.5"/>
    <text x="290" y="606" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">02-guest-provision-ubuntu.sh</text>
    <line x1="106" y1="616" x2="474" y2="616" stroke="#e5e7ea" stroke-width="1"/>

    <text x="106" y="638" font-size="12.5" fill="#1f2328">• AWS CLI v2, Google Cloud CLI</text>
    <text x="106" y="658" font-size="12.5" fill="#1f2328">• Terraform, OpenTofu, Docker, kubectl</text>
    <text x="106" y="678" font-size="12.5" fill="#1f2328">• VS Code, OnlyOffice, Kooha, OBS,</text>
    <text x="118" y="696" font-size="12.5" fill="#1f2328">Surfshark VPN, VLC, Chrome</text>
    <text x="106" y="718" font-size="12.5" font-weight="600" fill="#1f2328">• Harden firewall (ufw)</text>
    <text x="106" y="738" font-size="12.5" font-weight="600" fill="#1f2328">• Move dock to bottom of screen</text>
    <text x="106" y="758" font-size="12.5" font-weight="600" fill="#1f2328">• Full apt update &amp; upgrade</text>
  </g>

  <g>
    <rect x="610" y="584" width="400" height="184" rx="10" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>
    <text x="810" y="606" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">02-guest-provision-rocky.sh</text>
    <line x1="626" y1="616" x2="994" y2="616" stroke="#e5e7ea" stroke-width="1"/>

    <text x="626" y="638" font-size="12.5" fill="#1f2328">• AWS CLI v2, Google Cloud CLI</text>
    <text x="626" y="658" font-size="12.5" fill="#1f2328">• Terraform, OpenTofu, Docker, kubectl</text>
    <text x="626" y="678" font-size="12.5" fill="#1f2328">• VS Code, OnlyOffice, Kooha, OBS,</text>
    <text x="638" y="696" font-size="12.5" fill="#1f2328">Surfshark VPN, VLC, Chrome</text>
    <text x="626" y="718" font-size="12.5" font-weight="600" fill="#1f2328">• Harden firewall (firewalld)</text>
    <text x="626" y="738" font-size="12.5" font-weight="600" fill="#1f2328">• Add + move dock to bottom of screen</text>
    <text x="626" y="758" font-size="12.5" font-weight="600" fill="#1f2328">• Full dnf upgrade</text>
  </g>

  <line x1="290" y1="768" x2="290" y2="790" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="768" x2="810" y2="790" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Convergence -->
  <path d="M290,790 C290,806 400,806 400,806 L720,806 C720,806 830,806 830,790" fill="none" stroke="#57606a" stroke-width="2"/>
  <line x1="560" y1="806" x2="560" y2="824" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="828" width="540" height="50" rx="12" fill="#ddf4e4" stroke="#1a7f37" stroke-width="2"/>
  <text x="560" y="858" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f37">Hardened, ready-to-work desktop</text>
</svg>
